version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      production-dependencies:
        dependency-type: production
      # Routine development bumps can land quickly. Majors (currently
      # TypeScript 7, ESLint 10, Vite 8, Vitest 5, plugin-react 6 and friends)
      # need separate review: typescript-eslint 8 rejects TypeScript 7 outright.
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      development-major:
        dependency-type: development
        update-types:
          - major
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'ci(deps)'
