version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      # These packages must move together: browser revisions and coverage peers
      # are verified by the quality gates, not independently auto-bumped.
      playwright-browser:
        patterns:
          - playwright
          - '@playwright/test'
      vitest-coverage:
        patterns:
          - vitest
          - '@vitest/*'
      production-dependencies:
        dependency-type: production
      # Routine development bumps can land quickly. The TypeScript/ESLint
      # toolchain majors are isolated because typescript-eslint 8 rejects
      # TypeScript 7 outright; other majors can still be validated on their own.
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      development-typescript-toolchain:
        dependency-type: development
        update-types:
          - major
        patterns:
          - typescript
          - typescript-eslint
          - eslint
          - '@eslint/js'
      development-major:
        dependency-type: development
        update-types:
          - major
        exclude-patterns:
          - typescript
          - typescript-eslint
          - eslint
          - '@eslint/js'
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'ci(deps)'
