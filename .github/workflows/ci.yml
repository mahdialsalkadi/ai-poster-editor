name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', 'node']
    env:
      AI_PROVIDER: ''
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@12.16.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Install Chromium and system dependencies
        run: pnpm --filter @poster/server exec playwright install --with-deps chromium

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
      # Chromium's sandbox needs them, and production enables that sandbox, so
      # the test job must exercise the same configuration instead of disabling it.
      - name: Allow Chromium's sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "::warning::apparmor_restrict_unprivileged_userns is unavailable"
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || echo "::warning::unprivileged_userns_clone is unavailable"

      - name: Test
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee /tmp/poster-test.log

      - name: Enforce critical-source coverage
        run: pnpm test:coverage

      # The raw log archive needs repository admin rights. Re-emitting the
      # failure summary as annotations keeps it visible to anyone reviewing the
      # run and to the public checks API.
      - name: Surface test failures
        if: failure()
        run: |
          [ -f /tmp/poster-test.log ] || exit 0
          grep -a -E "FAIL |×|timed out|AssertionError|Error:|Tests +[0-9]+ failed" /tmp/poster-test.log | tail -20 | while IFS= read -r line; do
            escaped="${line//'%'/'%25'}"
            echo "::error title=vitest::${escaped}"
          done

      - name: Build
        run: pnpm build

      - name: Browser E2E and visual regression
        run: pnpm test:e2e

      - name: Retain quality reports and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-node-${{ matrix.node }}
          path: |
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Audit production dependencies
        run: pnpm audit --prod
