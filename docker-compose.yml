name: ai-poster-editor

# Public deployment topology. Only the proxy publishes ports. The API is the
# only service with both an edge address and the internal renderer network; the
# worker has no route to the internet or to the web/proxy services.
#
# Usage:
#   cp .env.example .env      # then set the production values described in README
#   docker compose up --build -d

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3001'
      # Exactly one proxy hop (this compose file). Do not copy this value to a
      # topology with a different number of trusted proxies.
      TRUST_PROXY: '1'
      EXPORT_WORKER_URL: http://worker:3002
      EXPORT_WORKER_TOKEN: ${EXPORT_WORKER_TOKEN:?set EXPORT_WORKER_TOKEN in .env}
      AI_SPEND_LEDGER_PATH: /data/ai-spend.json
    volumes:
      - spend:/data
    networks:
      - edge
      - worker-net
    depends_on:
      worker:
        condition: service_healthy
    cpus: '2.0'
    mem_limit: 1g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    # Deliberately no env_file: the renderer must not receive provider, Supabase
    # or access-control secrets. Only the internal bearer token is shared.
    environment:
      NODE_ENV: production
      WORKER_HOST: 0.0.0.0
      WORKER_PORT: '3002'
      EXPORT_WORKER_TOKEN: ${EXPORT_WORKER_TOKEN:?set EXPORT_WORKER_TOKEN in .env}
      EXPORT_CHROMIUM_SANDBOX: ${EXPORT_CHROMIUM_SANDBOX:-true}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    networks:
      - worker-net
    init: true
    # Chromium needs more than Docker's default 64 MiB /dev/shm to render.
    shm_size: 1gb
    cpus: '2.0'
    mem_limit: 2g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    networks:
      - edge
    cpus: '0.5'
    mem_limit: 128m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/poster.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    cpus: '0.5'
    mem_limit: 128m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

volumes:
  # Durable daily AI spend ledger. One API replica only: the file is not a
  # multi-writer store.
  spend:

networks:
  edge:
  worker-net:
    # No route to the internet and no direct access from web or proxy. The API
    # joins this network so it can reach the worker, but the worker cannot use
    # the API's edge connectivity.
    internal: true
